name: Bug report
description: 报告可稳定复现的异常
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 请勿在公开 Issue 中提交私密视频、账号信息或安全漏洞细节。
  - type: input
    id: version
    attributes:
      label: FrameCut 版本
      placeholder: 例如 0.3.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows 版本与硬件
      placeholder: 例如 Windows 11 24H2、Intel i7、16 GB RAM
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用可公开的测试素材描述最短复现路径。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与日志
    validations:
      required: true

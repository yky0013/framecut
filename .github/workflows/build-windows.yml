name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source and LFS files
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Verify bundled Whisper weights
        shell: pwsh
        run: |
          $models = @(Get-ChildItem -LiteralPath models -Recurse -Filter *.onnx)
          $totalBytes = ($models | Measure-Object -Property Length -Sum).Sum
          if ($models.Count -lt 2 -or $totalBytes -lt 70000000) {
            throw "Whisper ONNX files are missing or are still Git LFS pointers."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build Windows installer
        run: npm run dist

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath release -Filter 'FrameCut Setup *.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "FrameCut installer was not generated."
          }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameCut-Windows-${{ github.sha }}
          path: |
            release/FrameCut Setup *.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
